networks:
  recommender-net:
    driver: bridge

volumes:
  mlflow_data:
  redis_data:

services:
  redis:
    image: redis:7-alpine
    container_name: recommender-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - recommender-net
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.2
    container_name: recommender-mlflow
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - recommender-net
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --serve-artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"
        ]
      interval: 15s
      timeout: 20s
      retries: 20
      start_period: 90s
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recommender-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    networks:
      - recommender-net
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EMBEDDING_CACHE_TTL_SECONDS=3600
      - ARTIFACTS_DIR=/app/artifacts
      - DRIFT_KL_THRESHOLD=0.5
      - DRIFT_WINDOW=100
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s